services:
  whiteboard-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: teams-whiteboard-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - YPERSISTENCE=/data/yjs
    volumes:
      - whiteboard_data:/data

volumes:
  whiteboard_data:
